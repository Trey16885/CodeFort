name: Deploy CodeFort to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a run in progress finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check syntax of every module
        run: |
          for f in assets/js/*.js; do
            node --check "$f"
          done

      - name: Inject repository secrets into config.generated.js
        env:
          KEY_TOKEN: ${{ secrets.KEY_TOKEN }}
          SUP_URL: ${{ secrets.SUP_URL }}
          SUP_PB: ${{ secrets.SUP_PB }}
          COMMIT: ${{ github.sha }}
        run: node scripts/build-config.mjs

      # Evaluate the generated file rather than pattern-matching its source:
      # the emitted JSON quotes its keys, so a regex written against the
      # committed placeholder's unquoted style reports EMPTY for everything.
      - name: Report what was injected
        run: |
          node -e '
            const vm = require("node:vm");
            const src = require("fs").readFileSync("assets/js/config.generated.js", "utf8");
            const ctx = { window: {} };
            vm.createContext(ctx);
            vm.runInContext(src, ctx);

            const config = ctx.window.__CODEFORT_CONFIG__ || {};
            const state = (v) => (v ? `set (${String(v).length} chars)` : "EMPTY");
            for (const k of ["mistralKey", "supabaseUrl", "supabaseKey"]) {
              console.log(k.padEnd(12), state(config[k]));
            }

            // builtAt is stamped unconditionally, so an empty one means the
            // placeholder survived and no secret would reach the deployed site.
            if (!config.builtAt) {
              console.error("::error::config.generated.js was not regenerated - the placeholder would ship");
              process.exit(1);
            }
            console.log("built", config.builtAt, "from", (config.commit || "").slice(0, 7));
          '

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
